version: 2
updates:
  # Gradle 依赖与插件。版本目录在 android/gradle/libs.versions.toml。
  # 分组成组提 PR：否则 AndroidX 一升就是十几条，没人看得过来。
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-ksp:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp"]
      quality-tools:
        patterns: ["io.gitlab.arturbosch.detekt", "com.diffplug.spotless", "com.pinterest.ktlint*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    # 上游被投毒后的窗口：新版本先放 7 天再自动提。
    cooldown:
      default-days: 7

  # 设备工具插件已随仓库一起检出（tools/dsh-phone/plugins/android-tools）。
  # 它自己的依赖升级仍按代码改动走 review，不单独开 Dependabot 目录。
