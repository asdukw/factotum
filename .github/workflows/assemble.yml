name: Assemble

# 「装配 + 出包」这条路（拉 libnode → 装配 dsh → NDK 编 JNI → 打包）以前只有发版时才走，
# 于是平台差异全攒到发布那一刻才炸 —— v0.1.0 第一次出的包就是这么坏的（Linux 的 GNU tar
# 写不了 zip，产物是个改了后缀的 tar，装到设备上才会发现）。
#
# 这个 workflow 把那条路提前到平时跑，并且**出包之后再验一次产物结构**。
# 用 paths 过滤：只有真会影响装配的改动才触发（Kotlin 改动由 ci.yml 覆盖）。
on:
  push:
    branches: [master]
    paths: &assembly-paths
      - "tools/**" # 装配脚本、phone profile、插件 submodule 指针
      - "android/app/src/main/cpp/**" # JNI
      - "android/app/CMakeLists.txt"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - ".gitmodules"
      - ".github/workflows/assemble.yml"
  pull_request:
    paths: *assembly-paths
  workflow_dispatch:

concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    name: 装配 + 出包（不签名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: android-actions/setup-android@v4
      - name: 缓存 NDK / CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
            ${{ env.ANDROID_HOME }}/cmake/3.31.6
          key: android-ndk-cmake-${{ runner.os }}-ndk29.0.14206865-cmake3.31.6
      - name: 装 SDK 平台 / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v6
      - name: 缓存 dsh 装配暂存
        uses: actions/cache@v6
        with:
          path: android/.dsh-cache/runtime
          key: dsh-runtime-${{ runner.os }}-${{ hashFiles('tools/bundle-dsh.ps1', 'tools/dsh-phone/**') }}

      - name: 装配运行时（libnode + dsh）
        run: |
          pwsh -NoProfile -File tools/fetch-libnode.ps1
          # 模型的 glob / grep 要 ripgrep：bundle-dsh.ps1 会因为缺 .bin/rg 直接 throw
          # （profile 里启用了 tool-fs-search）。产物按 pinned 版本 + sha256 从 release 拉。
          pwsh -NoProfile -File tools/fetch-rg.ps1
          pwsh -NoProfile -File tools/bundle-dsh.ps1

      - name: 出包
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

# 出包之后**验产物本身**，而不是只看构建退出码 —— tar 冒充 zip 那次，构建是成功的。
      - name: 验产物结构
        run: |
          set -euo pipefail
          # 按 glob 找 APK，而不是写死 app-debug.apk：签名配置一旦被设成 null，AGP 会产出
          # `app-debug-unsigned.apk`，写死路径只会得到一句 "No such file or directory"，
          # 看不出原因（真发生过一次）。
          APK=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::出包步骤没产出任何 APK"
            exit 1
          fi
          echo "APK: $APK"
          ls -l "$APK"
          # 必须已签名 —— 没配签名材料时 debug 变体应回落到 AGP 的默认 debug 签名。
          # 未签名的包装不上，而这个错误在构建输出里是「成功」。
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          if ! "${BT}apksigner" verify "$APK" > /dev/null 2>&1; then
            echo "::error::APK 未签名（$APK）—— 装不上"
            exit 1
          fi
          # 失败时要能自己说明白：把 APK 里的 lib/ 与构建前的 jniLibs 都列出来
          echo "--- APK 里的 lib/ ---"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/' || echo "(一个都没有)"
          echo "--- 构建前的 jniLibs ---"
          ls -l android/app/src/main/jniLibs/*/ || echo "(jniLibs 是空的)"
          for entry in lib/arm64-v8a/libnode.so lib/arm64-v8a/libc++_shared.so; do
            unzip -l "$APK" "$entry" > /dev/null || { echo "::error::APK 里缺 $entry"; exit 1; }
          done
          # 运行时资产必须是真 zip（头两个字节 PK）；v0.1.0 那次是 tar 冒充 zip，而构建是成功的
          if [ "$(unzip -p "$APK" assets/dsh-runtime.zip | head -c 2)" != "PK" ]; then
            echo "::error::assets/dsh-runtime.zip 不是 zip —— 装到设备上会解压失败"
            exit 1
          fi

      - name: 上传 APK（排障用）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assemble-debug-apk
          retention-days: 1
          path: android/app/build/outputs/apk/debug/app-debug.apk
