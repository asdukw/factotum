name: Assemble

# 「装配 + 出包」这条路（拉 libnode → 装配 dsh → NDK 编 JNI → 打包）以前只有发版时才走，
# 于是平台差异全攒到发布那一刻才炸 —— v0.1.0 第一次出的包就是这么坏的（Linux 的 GNU tar
# 写不了 zip，产物是个改了后缀的 tar，装到设备上才会发现）。
#
# 这个 workflow 把那条路提前到平时跑，并且**出包之后再验一次产物结构**。
# 用 paths 过滤：只有真会影响装配的改动才触发（Kotlin 改动由 ci.yml 覆盖）。
on:
  push:
    branches: [master]
    paths: &assembly-paths
      - "tools/**" # 装配脚本、phone profile、插件 submodule 指针
      - "android/app/src/main/cpp/**" # JNI
      - "android/app/CMakeLists.txt"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - ".gitmodules"
      - ".github/workflows/assemble.yml"
      - ".github/actions/setup-build/**"
      - "!tools/**/*.md" # 只改 tools 下的文档不需要跑装配
  pull_request:
    paths: *assembly-paths
  workflow_dispatch:

concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    name: 装配 + 出包（不签名）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-build # zizmor: ignore[self-repository] actionlint 1.7.12 还不认 $/
        with:
          # Fork PR 没有 secret 时传空值，Gradle 正常构建，只不跨 runner 保存配置缓存。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 出包（debug + release）
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

# 出包之后**验产物本身**，而不是只看构建退出码 —— tar 冒充 zip 那次，构建是成功的。
      - name: 验产物结构
        run: |
          set -euo pipefail
          # 按 glob 找 APK，而不是写死 app-debug.apk：签名配置一旦被设成 null，AGP 会产出
          # `app-debug-unsigned.apk`，写死路径只会得到一句 "No such file or directory"，
          # 看不出原因（真发生过一次）。
          APK_DEBUG=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          APK_RELEASE=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$APK_DEBUG" ] || [ -z "$APK_RELEASE" ]; then
            echo "::error::出包步骤没有同时产出 debug 与 release APK"
            exit 1
          fi
          bash tools/verify-apk.sh "$APK_DEBUG"
          # release 变体在 CI 上没有签名材料，AGP 会产出 unsigned 包；结构仍要验。
          bash tools/verify-apk.sh "$APK_RELEASE" --allow-unsigned

      - name: 上传 APK（排障用）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: assemble-debug-apk
          retention-days: 1
          path: android/app/build/outputs/apk/*/*.apk
