name: CI

# 本仓库此前没有 CI，验证全靠「本机构建 / 单测 / 真机」。这里把**能在无设备环境跑的部分**
# 固定下来。注意边界：**CI 绿 ≠ 能用** —— 无障碍执行层、内嵌 Node 的启动、dsh 运行时装配
# 都只能在真机上验证（见 AGENTS.md「真机」）。CI 只保证编译、单测、静态检查这三关。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支连推时取消上一次：既省 runner，也让「最新一次是否绿」没有歧义
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 静态检查（ktlint / detekt / Android Lint）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # 上传 SARIF 到 Code Scanning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: 接受 SDK 许可并装 compileSdk 的平台
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      # 不装 NDK / CMake：这三关都不碰 native 构建（实测任务图里没有 cmake 任务），
      # 而 NDK 要下 ~1GB。APK 的装配另有本地流程（tools/fetch-libnode.ps1 + bundle-dsh.ps1）。
      - name: 门禁
        working-directory: android
        run: ./gradlew spotlessCheck detekt :app:lintDebug --console=plain
      - name: Android Lint 结果进 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: android/app/build/reports/lint-results-debug.sarif
          category: android-lint
      - name: detekt 结果进 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: android/build/reports/detekt/detekt.sarif
          category: detekt
      - name: 报告存档（失败时最需要它）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          retention-days: 14
          path: |
            android/build/reports/detekt/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt

  test:
    name: 单元测试（JVM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: 接受 SDK 许可并装 compileSdk 的平台
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      # 顺带编译 androidTest：Lint 默认**不看**测试源码（checkTestSources 关着），
      # 不编一遍的话那两个真机测试文件在 CI 里等于没人管。
      - name: 单测 + androidTest 编译
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --console=plain
      - name: 测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          retention-days: 14
          path: android/app/build/reports/tests/testDebugUnitTest/

  offline-checks:
    name: 离线自检（不需要设备）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # 这条是「扫描器/解码器确实会命中」的同类保障：审计回路自己先证明自己没坏，
      # 免得设备上的空结果被当成「一切正常」（见 AGENTS.md 的审计回路一节）。
      - run: node tools/audit/selftest.mjs
      # phone profile 的 YAML：写坏时 dsh 启动即报错，而内嵌 Node 与宿主同进程 ——
      # 报错就是整个 App 崩。本地由 bundle-dsh.ps1 把住，这里让它在 push 时也能被挡住。
      # js-yaml 从 npm 现取（本仓库不引入 npm 依赖，只在这条 job 里装）。
      - name: 校验 phone profile
        run: |
          # 钉 4.x：5.x 换掉了自定义 tag 的 API，脚本只支持 4.x（vendored 运行时里也是 4.x）
          npm install --no-save --no-audit --no-fund 'js-yaml@^4'

          node tools/dsh-phone/check-profile.mjs tools/dsh-phone/profile/cordis.patch.yml node_modules
      # 连接器的「只读」与「令牌不外泄」两条承诺靠插件测试守住（docs/email-connector.md §6）。
      # 它是本地插件、没有自己的 CI 仓库，所以在这里跑 —— 否则这两条只有人记得时才被验。
      # real-schema 找不到 dsh 运行时会自己 skip（CI 上没有），失败才是真失败。
      - name: 连接器插件测试（只读边界 / 令牌不外泄）
        run: |
          cd tools/dsh-phone/plugins/gmail
          npm test
      # zen 会话头补丁作用在**所有**出网请求上（它包了 globalThis.fetch），边界必须钉住：
      # 只有 zen 的主机名加头、已经带了头的不覆盖、重复安装只装一层。
      - name: zen 会话头补丁测试
        run: node tools/dsh-phone/test/zen-session-fetch.test.mjs
      # 提问 answerer 的边界：**接不了必须让路**（桥没配 / 用户关掉 / 桥报错 / 超时四种）。
      # 它唯一危险的地方是「编一个答案」—— waterfall 的返回值会被宿主当成用户说的。
      - name: 提问 answerer 测试（不编答案）
        run: |
          cd tools/dsh-phone/plugins/user-questions
          npm test
