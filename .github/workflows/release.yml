name: Release

# tag push 或从 master 手动补发历史 tag；触发 workflow 与实际构建源码可以是不同提交。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag 名（补发用）
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: 构建并签名
    runs-on: ubuntu-24.04
    # 环境允许 v* tag 与手动补发用的 master，并要求人工批准。
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: 校验 tag 形状
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::非法 tag: $TAG"; exit 1; }

      # 两个 sibling checkout，后续 checkout 的 clean 不会删除可信辅助器。
      # 不能从旧 tag 加载旧版 action/验证器，也不能把新 profile/launcher 复制进旧源码。
      - name: 取触发 workflow 的可信辅助器
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          persist-credentials: false

      # 缺项只检查一次，在 SDK/NDK 下载之前失败，绝不打印值。
      - name: 快速检查发布 secrets
        env:
          FACTOTUM_KEYSTORE_BASE64: ${{ secrets.FACTOTUM_KEYSTORE_BASE64 }}
          FACTOTUM_KEYSTORE_PASSWORD: ${{ secrets.FACTOTUM_KEYSTORE_PASSWORD }}
          FACTOTUM_KEY_ALIAS: ${{ secrets.FACTOTUM_KEY_ALIAS }}
          FACTOTUM_KEY_PASSWORD: ${{ secrets.FACTOTUM_KEY_PASSWORD }}
          FACTOTUM_GMAIL_CLIENT_ID: ${{ secrets.FACTOTUM_GMAIL_CLIENT_ID }}
          FACTOTUM_GMAIL_CLIENT_SECRET: ${{ secrets.FACTOTUM_GMAIL_CLIENT_SECRET }}
        run: bash workflow-tools/tools/ci/release-secrets.sh check

      - name: 取目标 tag 的源码（不接受同名 branch）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # versionName、签名/Gmail 合同与源码 SHA 都在装配前校验，未知历史合同明确拒绝。
      - name: 固定源码提交并校验目标构建合同
        id: source
        run: node workflow-tools/tools/ci/release-source.mjs resolve source

      - uses: ./workflow-tools/.github/actions/setup-build # zizmor: ignore[self-repository] 可信 workflow checkout
        with:
          source-directory: source
          # 缺键时正常回退，不要求新 secret 或权限。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 离线自检（目标 tag 的审计 / profile / 插件边界）
        working-directory: source
        run: bash tools/offline-checks.sh

      - name: 出包前过门禁（与 ci.yml 同一套）
        working-directory: source/android
        run: ./gradlew spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest --console=plain

      - name: 还原签名材料
        env:
          FACTOTUM_KEYSTORE_BASE64: ${{ secrets.FACTOTUM_KEYSTORE_BASE64 }}
        run: bash workflow-tools/tools/ci/release-secrets.sh restore

      - name: 出包（同一签名同时兼容 FACTOTUM / TAPPET Gradle 合同）
        working-directory: source/android
        env:
          FACTOTUM_KEYSTORE_PASSWORD: ${{ secrets.FACTOTUM_KEYSTORE_PASSWORD }}
          FACTOTUM_KEY_ALIAS: ${{ secrets.FACTOTUM_KEY_ALIAS }}
          FACTOTUM_KEY_PASSWORD: ${{ secrets.FACTOTUM_KEY_PASSWORD }}
          FACTOTUM_GMAIL_CLIENT_ID: ${{ secrets.FACTOTUM_GMAIL_CLIENT_ID }}
          FACTOTUM_GMAIL_CLIENT_SECRET: ${{ secrets.FACTOTUM_GMAIL_CLIENT_SECRET }}
        run: bash "$GITHUB_WORKSPACE/workflow-tools/tools/ci/release-secrets.sh" assemble

      - name: 清理临时 keystore（构建失败也执行）
        if: always()
        run: |
          if [ -n "${FACTOTUM_KEYSTORE_FILE:-}" ]; then rm -f -- "$FACTOTUM_KEYSTORE_FILE"; fi

      - name: 可信验签 + 结构 + 包内密钥扫描
        working-directory: source
        run: |
          set -euo pipefail
          PROOT=absent
          if [ -f android/app/src/main/assets/proot-runtime.json ]; then PROOT=required; fi
          bash "$GITHUB_WORKSPACE/workflow-tools/tools/verify-apk.sh" android/app/build/outputs/apk/release/app-release.apk --scan-secrets "--proot=$PROOT"

      - name: 暂存 release 资产
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          ASSET="factotum-$TAG-arm64-v8a.apk"
          cp source/android/app/build/outputs/apk/release/app-release.apk "release-artifacts/$ASSET"
          (cd release-artifacts && sha256sum "$ASSET" > "$ASSET.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7

  publish:
    name: 发布 release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: 校验 tag 形状
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::非法 tag: $TAG"; exit 1; }

      - name: 取触发 workflow 的可信辅助器
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          persist-credentials: false

      - name: 只取 build 已固定的源码 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: tag 仍指向构建提交才允许证明和发布
        run: node workflow-tools/tools/ci/release-source.mjs verify-tag source

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts

      - name: 生成实际源码的 SLSA v1 predicate（保留真实触发 workflow）
        env:
          WORKFLOW_DIRECTORY: workflow-tools
        run: node workflow-tools/tools/ci/release-source.mjs provenance source release-provenance.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifacts/*.apk
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: release-provenance.json

      - name: 写 job summary
        run: |
          set -euo pipefail
          ASSET="factotum-$TAG-arm64-v8a.apk"
          {
            echo "### Release $TAG"
            echo ""
            echo "- Source commit: $SOURCE_SHA"
            echo "- APK: $(stat -c%s "release-artifacts/$ASSET") bytes"
            echo "- SHA-256: \`$(cut -d' ' -f1 "release-artifacts/$ASSET.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发 release（已有 draft 也会公开，保留幂等与说明）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node workflow-tools/tools/ci/release-publish.mjs source release-artifacts
