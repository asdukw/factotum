name: Workflow lint

# workflow / action / 离线回归输入变动时跑：actionlint 抓语法与表达式注入，
# zizmor 抓未钉 SHA、危险触发器与权限边界。
on:
  pull_request:
    paths: &workflow-paths
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "tools/ci/**"
      - "tools/verify-apk.sh"
      - "tools/offline-checks/**"
      - "tools/offline-checks.sh"
      - "tools/offline-checks/package.json"
      - "tools/offline-checks/package-lock.json"
  push:
    branches: [master]
    paths: *workflow-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Workflow 离线回归（不上传、不发布）
        run: |
          npm --prefix tools/offline-checks ci --ignore-scripts --no-audit --no-fund
          node --test tools/ci/*.test.mjs
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          # 不开 SARIF 上传，省掉 security-events: write；注解足够指出位置。
          advanced-security: false
          annotations: true
