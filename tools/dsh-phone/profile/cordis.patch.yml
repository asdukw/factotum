# phone profile：Android 上 dsh 的用户 patch 层（已在 PC 上验证组合可跑通，见 docs/dsh-android.md §7）。
# 原则：只留 agent kernel + LLM + 会话；禁用一切依赖 shell / node-pty / sharp /
# node-addon-system / pnpm / 客户端 loader 的行。

# --- 桌面/原生/客户端行禁用 ---
# 注：typert 三件套（registry / loader / api-gateway）是 Web 表层 RPC 的必需行，不能禁。
- id: plugin-manager
  disabled: true
# 会话标题是纯展示能力，headless 用不上，且它的 LLM provider 对 mount 顺序有假设
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: shell-env
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: fs-sandbox
  disabled: true
- id: fs-observation-policy
  disabled: true

# image-offload **不**禁用（2026-10-17）：它是纯 JS、无原生依赖（peerDeps 在 runtime 里齐），
# 而视觉路径每步都可能截图、图会被每轮请求重发 —— 超 20MiB 预算时它是「丢最老的图重试」
# 与「整轮硬失败（IMAGE_OFFLOAD_REQUIRED）」的区别。代价如实记着：offload = **永久丢帧**，
# 模型之后拿不到那张图（占位文本里的路径读不了，tool-fs 是禁用的），只保证请求不炸。

# --- 附件存储：换成纯 JS 实现（Android 没有 sharp） ---
# dsh-base 默认挂 @deepseek-ai/dsh-attachment-local，它用 sharp 做归一化与质量阶梯
# 编码，而 sharp 没有 Android 产物（bundle 用 --os=android 装，原生二进制根本不在），
# 一存图就报 Could not load the "sharp" module。这里禁掉，改挂本仓库的纯 JS 等价实现
# （见文件末尾 insert 段的 android-attachments / tools/dsh-phone/android-attachments）。
- id: attachment-local
  disabled: true

# --- DeepSeek 官方通道/遥测禁用（本轮只用 opencode zen） ---
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: web-search-deepseek
  disabled: true

# --- 模型：pi-ai 路由。端点 / 调用风格 / 模型三件套都由宿主进程按设置页的预选注入 ---
# （设置页 → AgentConfigStore → LlmPreset → NodeRuntime 的 env → 这里）
#
# **三件事必须成套**：OpenAI 是 openai-responses、Anthropic 是 anthropic-messages、
# DeepSeek 与 opencode zen 是 openai-completions。风格拿错不会在启动时报错，
# 只会在第一次请求时以 404/400 的形式炸出来 —— 看着像网络问题，其实是配错了协议。
- id: llm-pi-ai
  config:
    providers:
      tappet:
        displayName: Tappet 端点
        apiKeyEnv: TAPPET_LLM_KEY
        api: !!js process.env.TAPPET_LLM_API ?? 'openai-completions'
        # 兜底是内置端点：本机没在设置页配过时的默认（也是真机上唯一跑通过的那条）。
        baseURL: !!js process.env.TAPPET_LLM_BASE_URL ?? 'https://opencode.ai/zen/go/v1'
        # x-opencode-session 是 opencode zen 的硬要求；别的服务商带上它没有意义，
        # 所以按预选给空对象而不是无条件发。
        headers: !!js "process.env.TAPPET_LLM_ZEN === '1' ? { 'x-opencode-session': process.env.TAPPET_LLM_SESSION ?? 'tappet-mobile' } : {}"

        models:
          # 列出的都是 pi-ai 目录里**真实存在**的 id（对应 agent/LlmPreset.kt 的候选）。
          # 不显式声明 input 时 MODALITIES 只当 text，工具结果里的图会被 pi-ai 以
          # "does not support image input" 直接拒掉；声明了才收图。没列出的 id 也能用，
          # 但同样只有文本模态。
          - id: deepseek-v4.1-flash
            input: [text, image]
          - id: glm-5.3
            input: [text]
          - id: kimi-k3
            input: [text, image]
          - id: qwen3.8-max
            input: [text, image]
          - id: gpt-6-sol
            input: [text, image]
          - id: gpt-5.6-sol
            input: [text, image]
          - id: claude-sonnet-5
            input: [text, image]
          - id: claude-opus-5-5
            input: [text, image]
          - id: deepseek-flash
            input: [text, image]
          - id: deepseek-v4-pro
            input: [text]
        # thinkingFormat 只在对方**没有原生推理协议**时才需要（zen / DeepSeek 的 reasoning
        # 字段靠它解析）。OpenAI 的 responses 与 Anthropic 的 messages 自带推理块，
        # 那时宿主会注入空串，这里就是空对象。
        compat: !!js "process.env.TAPPET_LLM_THINKING_FORMAT ? { thinkingFormat: process.env.TAPPET_LLM_THINKING_FORMAT } : {}"

- id: agent-default-model
  config:
    provider: tappet
    model: !!js process.env.TAPPET_LLM_MODEL ?? 'deepseek-v4.1-flash'

# --- 手机 agent 的系统提示 ---
- id: system-prompt
  config:
    personaPrefix: |-
      你是 Tappet，运行在用户 Android 手机上的 agent。你可以调用通用设备工具直接操作手机界面，
      帮用户完成任务。
      **有控件树时**用 read_screen 读屏、tap_node 点击 —— 那条路最稳，优先走它。
      **读屏没有任何可读节点时**（该 App 对无障碍隐藏了控件树）改用视觉路径：capture_frame 取一帧，
      在图上找到目标后用 tap_target 给出该帧的**图像像素**外框；坐标不要自己换算，执行层会做。
      每次只做一个原子动作；动作后确认结果（tap_target 会回界面有没有变化），没变就重新取帧再给坐标；
      同一动作失败两次就换策略；只做用户明确要求的事。
    personaSuffix: ''

- id: agent-preset-registry
  config:
    default: phone

- insert:
    - id: preset-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: phone
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              prefix: |-
                你是 Tappet，运行在用户 Android 手机上的 agent。你可以调用通用设备工具直接操作手机界面，
                帮用户完成任务。
                **有控件树时**用 read_screen 读屏、tap_node 点击 —— 那条路最稳，优先走它。
                **读屏没有任何可读节点时**（该 App 对无障碍隐藏了控件树）改用视觉路径：capture_frame 取一帧，
                在图上找到目标后用 tap_target 给出该帧的**图像像素**外框；坐标不要自己换算，执行层会做。
                每次只做一个原子动作；动作后确认结果（tap_target 会回界面有没有变化），没变就重新取帧再给坐标；
                同一动作失败两次就换策略；只做用户明确要求的事。
          - id: android-tools
            name: dsh-plugin-android-tools
# --- 文件系统：Android 没有 bwrap/node-addon-system，改用本地 FS provider ---
# dsh-fs-local 的 koffi 只在 win32 分支懒加载，Android 上走 node:fs 直连。
- insert:
    - id: fs
      name: '@deepseek-ai/dsh-fs-local'
# --- 附件存储：工具结果里的图要经它落盘才能进模型请求 ---
# dsh 自带的 @deepseek-ai/dsh-attachment-local 依赖 sharp（无 Android 产物），
# 这里换成纯 JS 的等价实现（源码在 tools/dsh-phone/android-attachments）。
- insert:
    - id: android-attachments
      name: 'dsh-android-attachments'

# --- 设备工具：本地桥（Kotlin DeviceBridgeServer）→ 无障碍执行层 ---
# 插件源码是独立公开仓库的 git submodule（tools/dsh-phone/plugins/*）。
- insert:
    - id: dsh-android-tools
      name: 'dsh-plugin-android-tools'

# --- SDK stdio JSON-RPC：Kotlin 宿主当 client，提交任务并接收会话事件 ---
# stdout 归 JSON-RPC（部署约束：不要挂 stdout logger）；诊断走 stderr。
- insert:
    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      config:
        maxTokensAsSuccess: true
