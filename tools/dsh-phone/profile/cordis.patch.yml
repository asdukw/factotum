# phone profile：Android 上 dsh 的用户 patch 层（已在 PC 上验证组合可跑通，见 docs/dsh-android.md §7）。
# 原则：只留 agent kernel + LLM + 会话；禁用一切依赖 shell / node-pty / sharp /
# node-addon-system / pnpm / 客户端 loader 的行。

# --- 桌面/原生/客户端行禁用 ---
# 注：typert 三件套（registry / loader / api-gateway）是 Web 表层 RPC 的必需行，不能禁。
- id: plugin-manager
  disabled: true
# 会话标题是纯展示能力，headless 用不上，且它的 LLM provider 对 mount 顺序有假设
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: subprocess
  disabled: false
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: shell-env
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
# tool-fs **不**禁用（2026-10-18）：长期记忆要靠它写。
# dsh 没有独立的「记忆」插件 —— 官方的长期记忆机制就是**指令文件**（见下面的
# agent-instructions）。文件要能被写，模型就得有 read / write / edit 三个文件工具。
#
# 通用write/edit由应用fs包装层阻止写角色/世界书、数据库、运行模块与配置。
# cwd仍不是围栏，读取不受此保护；经审批的同UID shell不属于此沙箱。
- id: tool-fs
  disabled: false
# tool-fs-search（模型的 glob / grep）也开：记忆文件一多，没有检索模型就只能靠 INDEX 猜。
# 它依赖 `@vscode/ripgrep` 的**打包二进制**，而那个包没有 android 产物 —— 我们交叉编译了
# 一份（.github/workflows/rg.yml），由 tools/fetch-rg.ps1 拉进 jniLibs，
# 再用 tools/dsh-phone/ripgrep-stub 顶掉那个包、把 rgPath 指过去。三处缺一不可。
- id: tool-fs-search
  disabled: false
- id: fs-sandbox
  disabled: true
- id: fs-observation-policy
  disabled: true

# image-offload **不**禁用（2026-10-17）：它是纯 JS、无原生依赖（peerDeps 在 runtime 里齐），
# 而视觉路径每步都可能截图、图会被每轮请求重发 —— 超 20MiB 预算时它是「丢最老的图重试」
# 与「整轮硬失败（IMAGE_OFFLOAD_REQUIRED）」的区别。代价如实记着：offload = **永久丢帧**，
# 模型之后拿不到那张图（占位文本里的路径读不了，tool-fs 是禁用的），只保证请求不炸。

# --- 附件存储：换成纯 JS 实现（Android 没有 sharp） ---
# dsh-base 默认挂 @deepseek-ai/dsh-attachment-local，它用 sharp 做归一化与质量阶梯
# 编码，而 sharp 没有 Android 产物（bundle 用 --os=android 装，原生二进制根本不在），
# 一存图就报 Could not load the "sharp" module。这里禁掉，改挂本仓库的纯 JS 等价实现
# （见文件末尾 insert 段的 android-attachments / tools/dsh-phone/android-attachments）。
- id: attachment-local
  disabled: true

# --- DeepSeek 官方通道/遥测禁用（本轮只用 opencode zen） ---
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
# web-search-deepseek **不**禁用：它是 dsh 自带的搜索 provider，见下面的「联网搜索」一节。
# 名字里的 deepseek 指的是「Anthropic 兼容 Messages + 原生 web_search」这套协议，
# 端点由 baseURL 决定 —— zen 的 Anthropic 兼容端点同样吃这一套。

# --- 模型：pi-ai 路由。端点 / 调用风格 / 模型三件套都由宿主进程按设置页的预选注入 ---
# （设置页 → AgentConfigStore → LlmPreset → NodeRuntime 的 env → 这里）
#
# **三件事必须成套**：OpenAI 是 openai-responses、Anthropic 是 anthropic-messages、
# DeepSeek 与 opencode zen 是 openai-completions。风格拿错不会在启动时报错，
# 只会在第一次请求时以 404/400 的形式炸出来 —— 看着像网络问题，其实是配错了协议。
- id: llm-pi-ai
  config:
    providers:
      zoneu:
        displayName: Zoneu 端点
        apiKeyEnv: ZONEU_LLM_KEY
        api: !!js process.env.ZONEU_LLM_API ?? 'openai-completions'
        # 兜底是内置端点：本机没在设置页配过时的默认（也是真机上唯一跑通过的那条）。
        baseURL: !!js process.env.ZONEU_LLM_BASE_URL ?? 'https://opencode.ai/zen/go/v1'
        # x-opencode-session 是 opencode zen 的硬要求；别的服务商带上它没有意义，
        # 所以按预选给空对象而不是无条件发。
        headers: !!js "process.env.ZONEU_LLM_ZEN === '1' ? { 'x-opencode-session': process.env.ZONEU_LLM_SESSION ?? 'zoneu-mobile' } : {}"

        # 模型清单由宿主在启动时按「当前选中的模型」写成 JSON（NodeRuntime 的 ZONEU_LLM_MODELS）。
        # 路由键 zoneu 不是 pi-ai 目录里的 provider，适配器不会从安装目录补模型：未声明的 id
        # 会以 UNKNOWN_MODEL 失败（不是退化成纯文本）。所以清单必须动态生成，否则手填模型与
        # 自定义提供商全都不可用。input 也由宿主按目录模态声明，目录外的 id 一律 text。
        #
        # 下面的 fallback 只给「没有 ZONEU_LLM_MODELS 环境变量」的场景（PC 侧 profile 校验、
        # 直接跑 dsh）：Android 上 NodeRuntime 启动前一定会注入它。
        models: !!js "JSON.parse(process.env.ZONEU_LLM_MODELS ?? '[{\"id\":\"deepseek-v4.1-flash\",\"input\":[\"text\",\"image\"]}]')"
        # thinkingFormat 只在对方**没有原生推理协议**时才需要（zen / DeepSeek 的 reasoning
        # 字段靠它解析）。OpenAI 的 responses 与 Anthropic 的 messages 自带推理块，
        # 那时宿主会注入空串，这里就是空对象。
        compat: !!js "process.env.ZONEU_LLM_THINKING_FORMAT ? { thinkingFormat: process.env.ZONEU_LLM_THINKING_FORMAT } : {}"

- id: agent-default-model
  config:
    provider: zoneu
    model: !!js process.env.ZONEU_LLM_MODEL ?? 'deepseek-v4.1-flash'

# --- 联网搜索：dsh 自带的 web 能力 seam（2026-10-18） ---
# `dsh-web`（seam）与 `dsh-tool-web`（模型可见的 `web_search` / `web_fetch`，带提示词指引、
# 来源上限、超时、把结果标成**外部不可信数据**）由 dsh-base 默认挂载；这里只把**搜索 provider**
# 接上。它走 Anthropic 兼容的 Messages API + 原生 `web_search_20250305` 服务器工具 ——
# 不另接一家搜索 API（Bing Web Search API 已退役、Google Custom Search JSON API 已对新客户
# 关闭，见 docs/web-search.md）。
#
# 端点与模型由宿主按当前提供商注入（`LlmPreset.Endpoint.search` → NodeRuntime 的 env）：
# zen 的 Anthropic 兼容端点是 `/zen/go/v1/messages`，实测 `claude-haiku-5-5` 的原生搜索
# 可用（`usage.server_tool_use.web_search_requests: 1`）—— 注意同一个模型在 zen 的
# `/responses` 上是被协议门挡掉的，所以走这条比走 Responses 宽。
# 基址只给到 `/v1`，provider 自己追加 `/messages`。
#
# **没有可用 provider 时工具照样挂着**，每次调用回结构化的 `WEB_PROVIDER_UNAVAILABLE` ——
# 与连接器同一条理由（docs/email-connector.md §1.4）：工具随配置忽隐忽现会让模型的行为
# 不可预测。可用性是廉价的局部检查（密钥在不在），所以不支持的提供商让宿主把 `apiKeyEnv`
# 指到一个解析不到的变量名即可，不需要在这里写分支。
- id: web-search-deepseek
  config:
    # 用 `||` 而不是 `??`：不支持的提供商由宿主注入**空串**，空串要走兜底而不是被当成有效值。
    # 兜底只是「PC 侧直接跑 dsh」的形状；Android 上真正决定可用性的是下面的 apiKeyEnv。
    baseURL: !!js process.env.ZONEU_WEB_SEARCH_BASE_URL || 'https://api.deepseek.com/anthropic/v1'
    model: !!js process.env.ZONEU_WEB_SEARCH_MODEL || 'deepseek-v4-flash'
    apiKeyEnv: !!js process.env.ZONEU_WEB_SEARCH_KEY_ENV || 'DEEPSEEK_API_KEY'
    maxUses: 5

# 工具行（`web_search` / `web_fetch`）**在宿主层重新启用**。
# dsh-base 本来有这一行，但 dsh-web-app（本 profile 的第二个 bundle）把它 `disabled: true`
# 了，改成「按 agent preset 组合」—— 它的 standard 预置就是这么做的。
# 我们试过照它的样子放进 `preset-phone` 的 plugins 里：**组合结果里有那一行，但工具进不了
# 模型的工具表**（真机实测：模型明确说「没有 web_search 这个工具」，而日志里一个错都没有）。
# 放回宿主层就对了 —— 这一层 `tools` / `web` / `systemPrompt` 三个注入都在同一作用域。
- id: tool-web
  disabled: false
  config:
    fetch: true
    searchTimeoutMs: 60000

# --- 长期记忆：dsh 自带的指令文件加载器（2026-10-18） ---
# dsh **没有**独立的「记忆」插件。官方的长期记忆机制就是这一条：把 `$DSH_HOME/AGENTS.md`
# （用户全局）与从项目根到工作目录的指令链读进上下文，`dsh-base` 默认给 64 KiB 预算。
# 我们的 `DSH_HOME` = `ZONEU_WORKDIR` = `files/dsh-home`，所以记忆文件落在
# `files/dsh-home/AGENTS.md`（App 私有目录，与会话库同级）。
#
# `dsh-web-app` 把它禁了 —— 与 tool-web 同一个文件、同一类坑：**必须在宿主层
# `disabled: false` 重新启用**，放进 agent preset 的 plugins 里不管用。
#
# 写入靠 tool-fs 的 read / write / edit（见上面那条）。所以「记忆」的完整链路是：
# 模型用 write/edit 改 `files/dsh-home/AGENTS.md` → 下一次请求 agent-instructions
# 把它读进上下文。用户随时能通过 adb / 以后的设置页看到并改这个文件。
- id: agent-instructions
  disabled: false
  config:
    maxBytes: 65536

# --- 把 dsh 官方预置里有、而我们缺的能力逐条补回来（2026-10-18） ---
# 清单来自 `node tools/dsh-phone/preset-diff.mjs`：官方 preset-standard 有 19 条插件，
# 我们的 preset-phone 只有 2 条。缺的那些里有一批是「宿主级本来就该有、被 dsh-web-app 禁了」，
# 所以在这里 `disabled: false` 打开 —— **必须在宿主层**，放进 preset 的 plugins 里不管用
# （tool-web 与 agent-instructions 都这么踩过）。宿主级不存在的行（例如 tool-ask-user，
# 它只在 presets/*.yml 里）则用下面的 `- insert:` 加。
#
# 这几个都只需宿主级已有的服务（tools / commands / goals / jobs / skills / sessionProjections），
# 依赖都已在组合里。**每加一批都要真机验一次 mount**：这几行写坏会让整棵 cordis 根 mount 失败，
# 而内嵌 Node 与宿主同进程 —— 那就是整个 App 崩。
- id: tool-todo # todo_write：事件溯源的任务清单
  disabled: false
- id: tool-goal # 同会话 goal 的模型侧工具
  disabled: false
- id: command-goal # /goal 这个人类侧命令
  disabled: false
- id: tool-jobs # 后台任务：job_output / job_list / job_kill
  disabled: false
- id: skill-filesystem # 从工作区文件系统发现技能
  disabled: false
- id: tool-skill # 模型侧加载技能
  disabled: false
- id: plan-mode # 计划模式（含 slash command）
  disabled: false

# 上下文压缩栈：手机上跑长任务迟早撞上下文墙，没有它只能看着会话变哑。
# 三条是一套 —— `compaction-basic` 是服务本身，`command-compact` 给 /compact 命令，
# `tool-result-pruner` 剪掉旧工具结果的体积（视觉路径每步一张图，这条尤其重要）。
# 注意 `image-offload` 一直是开的（见文件顶部），它和 pruner 是两回事：
# offload 是「超预算时丢最老的图重试」，pruner 是「平时就把旧结果压小」。
- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false

# **tool-ask-user 不要开**（2026-10-18 真机踩过）：它 inject 的 `tools` + `userQuestions`
# 宿主层都有，所以能挂上、也能被调用 —— 但它是**阻塞**的：等用户回答，而我们的 Compose
# 聊天没有回答它的入口。结果是整轮永久挂住（会话一直 running，没有任何后续事件，
# 用户看到的是永远转圈）。要开它必须先做 UI 那一半：把问题渲染出来、把答案送回
# `ctx.userQuestions`。在那之前，一个会永久挂住回合的工具比没有这个工具更糟。
#
# 2026-10-18 稍后：UI 那一半做完了（`UserQuestionSheet` + `UserQuestionBridgeServer`
# + `dsh-plugin-user-questions`），所以这里开回来。宿主级没有这一行，要 insert。
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# --- 手机 agent 的系统提示 ---
# 系统提示的正文（人格）由**宿主**注入：Android 侧的 `PersonaStore` 把它拼成
# 「soul（可切换）+ 操作契约（固定）+ 语气契约（可关）」，写进 `ZONEU_PERSONA_PREFIX`。
#
# **哪一份生效是个已知的模糊点**：preset 里那份挂着 `complete: true`，理论上会遮蔽这一份；
# 但实测生效的是**这一份**（模型的系统提示里能看到「长期记忆」「联网搜索」，而那两段只在
# 这里出现过）。所以两处不再各写一份全文，都从同一个 env 取值：谁生效，内容都相同。
#
# 下面的兜底只在「没有 Android 宿主」时用到（PC 侧直接跑 dsh、`check-profile.mjs`）。
# 真机上 NodeRuntime 启动时设一次、每次 reload 时随 runtime-config.json 覆盖一遍。
- id: system-prompt
  config:
    personaPrefix: !!js process.env.ZONEU_PERSONA_PREFIX || '你是 zoneu，运行在用户 Android 手机上的 agent。用 read_ui_tree 读屏、tap_node 点击；读不到控件树时改用视觉路径 capture_screenshot + tap_target。每次只做一个原子动作，只做用户明确要求的事。'
    personaSuffix: ''

- id: agent-preset-registry
  config:
    default: phone

- insert:
    - id: preset-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: phone
        order: 0
        plugins:
          # 设备时间用变量插值而不是单独的 section：`{{device_now}}` 由 android-tools 插件注册
          # （index.mjs 的 registerDeviceClock，每次 assemble 重新取时间）。实测当前生效的是
          # 上面 `system-prompt.personaPrefix` 那份（系统提示里能看到「长期记忆」「联网搜索」，
          # 只有全局那份有），preset 这份是 complete: true 的备用路径 —— 两处都写，因为哪份生效
          # 取决于 preset 有没有被套上，而写错的代价是模型又去翻时钟。插件不在时 dsh 会因未知
          # 变量直接报错，这是故意的。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # `complete: true` 理论上会把这份 prefix 变成唯一段落（遮蔽上面宿主级那份），
              # 但实测生效的是宿主级那份（见文件上方 system-prompt 的注释）。两处内容都来自
              # 同一个 ZONEU_PERSONA_PREFIX，所以哪一份生效结果都一样 —— 见 PersonaStore。
              complete: true
              prefix: !!js process.env.ZONEU_PERSONA_PREFIX || '你是 zoneu，运行在用户 Android 手机上的 agent。用 read_ui_tree 读屏、tap_node 点击；读不到控件树时改用视觉路径 capture_screenshot + tap_target。每次只做一个原子动作，只做用户明确要求的事。'
          - id: android-tools
            name: dsh-plugin-android-tools
# --- 文件系统：Android 没有 bwrap/node-addon-system，改用本地 FS provider ---
# dsh-fs-local 的 koffi 只在 win32 分支懒加载，Android 上走 node:fs 直连。
- insert:
    - id: fs
      name: 'dsh-plugin-character-cards/protected-fs'
# --- 附件存储：工具结果里的图要经它落盘才能进模型请求 ---
# dsh 自带的 @deepseek-ai/dsh-attachment-local 依赖 sharp（无 Android 产物），
# 这里换成纯 JS 的等价实现（源码在 tools/dsh-phone/android-attachments）。
- insert:
    - id: android-attachments
      name: 'dsh-android-attachments'

# --- 设备工具：本地桥（Kotlin DeviceBridgeServer）→ 无障碍执行层 ---
# 插件源码随本仓库一起检出（tools/dsh-phone/plugins/*）。
- insert:
    - id: dsh-android-tools
      name: 'dsh-plugin-android-tools'

# --- 邮箱连接器：只读的 Gmail 工具 ---
# 令牌不在这里：插件经本地连接器桥（Kotlin ConnectorBridgeServer）换一个短命的 access token，
# refresh token 从不离开宿主。没配连接器时它照样挂着，每次调用回 NOT_CONNECTED ——
# 「工具在、但会如实报错」比「工具随配置忽隐忽现」对模型更可预测（docs/email-connector.md §1.4）。
- insert:
    - id: dsh-gmail
      name: 'dsh-plugin-gmail'

# --- 审批：dsh 官方的 user-approval seam ---
# dsh-base 已经挂了 `@deepseek-ai/dsh-user-approval`，但它的默认策略是
# `DSH_PERMISSION_MODE === 'danger-full-access' ? 'never' : 'ask'`。宿主为了沙箱语义设了
# danger-full-access，于是审批被读成 `never` —— 所有 `ask` 都会被确定性拒绝。手机没有沙箱，
# 这里把策略单独覆盖回 `ask`。
#
# answerer 由 `dsh-plugin-approval` 提供：它把 `approval/request` 转给 App 的确认面板
# （第四个本地桥，见 ApprovalBridgeServer），并且和提问一样用 `prepend: true` 排在
# `dsh-api-remotes` 前面 —— 那一层等的是浏览器回答，手机上没人消费。
# 语义、fail-closed 与已知限制见 docs/approvals.md。
- id: approval
  config:
    policy: ask

- insert:
    - id: dsh-approval
      name: 'dsh-plugin-approval'

# --- 用户提问：`ask_user_question` 的 answerer ---
# dsh 原生的答案是注册在 Cordis waterfall `user-questions/request` 上的 answerer 给的
# （官方 Web UI 经 `dsh-api-remotes` 转发过去）。我们的 Kotlin 宿主不连那条 Web 通道，
# 所以这个插件自己当 answerer，把问题转给 App 的 UI（第三个本地桥，见 UserQuestionBridgeServer）。
#
# 它用 `prepend: true` 注册 —— **必须排在 api-remotes 前面**：那个包会把请求推进 remote 队列
# 等浏览器回答，而没人消费时请求就永远不落地（实测过：会话一直 running、几分钟没有后续事件）。
# 形状与语义（单选 custom 覆盖 / 多选 custom 补充 / 跳过 = 空 selected）逐字对齐 dsh，
# 见 docs/user-questions.md。
- insert:
    - id: dsh-user-questions
      name: 'dsh-plugin-user-questions'

# --- SDK stdio JSON-RPC：Kotlin 宿主当 client，提交任务并接收会话事件 ---
# stdout 归 JSON-RPC（部署约束：不要挂 stdout logger）；诊断走 stderr。
- insert:
    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      config:
        maxTokensAsSuccess: true

